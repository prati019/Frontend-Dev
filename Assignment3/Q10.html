<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Dropdown Selection</title>
</head>

<body>

    <h1>Choose Location</h1>

    <label for="country">Country:</label>
    <select id="country" name="country">
        <option value="india" selected>India</option>
        <option value="usa">USA</option>
    </select>
    <br>

    <label for="state">State:</label>
    <select id="state" name="state">
        <option value="rajasthan" selected>Rajasthan</option>
        <option value="maharashtra">Maharashtra</option>
    </select>
    <br>

    <label for="city">City:</label>
    <select id="city" name="city">
        <option value="jaipur" selected>Jaipur</option>
        <option value="mumbai">Mumbai</option>
    </select>
    <br>

    <label for="place">Favorite Place:</label>
    <select id="place" name="place">
        <option value="hawamahal" selected>Hawa Mahal</option>
        <option value="amberfort">Amber Fort</option>
    </select>

    <p>I chose <strong>India</strong>, <em>Rajasthan</em>, <mark>Jaipur</mark> and my favorite place is <small>Hawa Mahal</small>.</p>

</body>
</html>
